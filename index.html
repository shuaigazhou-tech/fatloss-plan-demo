<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="记录体重与每日饮食，轻松查看今天的热量进度。">
  <title>刚刚好的减脂计划｜首页</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="index.html"><span class="brand-mark">好</span><span>刚刚好计划</span></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="siteNav">菜单</button>
      <nav class="site-nav" id="siteNav" aria-label="主导航">
        <a href="index.html" aria-current="page">首页</a>
        <a href="diet.html">饮食</a>
        <a href="workout.html">训练</a>
        <a href="progress.html">进度</a>
        <a href="takeout.html">外卖</a>
        <a href="ai-food.html">AI 识餐</a>
        <a href="history.html">记录</a>
      </nav>
    </div>
  </header>

  <main id="main" class="home-main">
    <section class="home-dashboard" aria-labelledby="home-title">
      <div class="home-heading">
        <div><span class="eyebrow" id="dashboardDate">今天</span><h1 id="home-title">今天，照顾好自己。</h1></div>
        <p class="lede">记下体重和每一餐，其余交给这里。</p>
      </div>

      <div class="home-stats" aria-label="今日数据">
        <article class="home-stat home-stat-weight">
          <span class="home-stat-icon" aria-hidden="true">⚖</span>
          <span class="pet-doodle pet-cat" aria-hidden="true">
            <svg viewBox="0 0 72 72" focusable="false">
              <path class="pet-fill" d="M16 29 18 13l13 9c4-2 8-2 12 0l13-9 1 17c5 6 7 14 4 21-4 10-14 15-25 15S14 61 10 51c-3-8-1-16 6-22Z"/>
              <path d="M16 29 18 13l13 9c4-2 8-2 12 0l13-9 1 17c5 6 7 14 4 21-4 10-14 15-25 15S14 61 10 51c-3-8-1-16 6-22Z"/>
              <path d="M27 40h1m16 0h1M34 48c2 2 4 2 6 0m-3-3v3M23 47 9 44m14 8L8 54m41-7 14-3m-14 8 15 2"/>
            </svg>
          </span>
          <span class="metric-label">当前体重</span>
          <strong class="home-stat-value"><span id="homeWeight">—</span><small>kg</small></strong>
          <span class="metric-note" id="homeWeightNote">登录后录入资料</span>
        </article>
        <article class="home-stat">
          <span class="home-stat-icon" aria-hidden="true">◒</span>
          <span class="metric-label">今日已摄入</span>
          <strong class="home-stat-value"><span id="todayCalories">0</span><small>kcal</small></strong>
          <span class="metric-note" id="mealCountNote">还没有记录餐食</span>
        </article>
        <article class="home-stat home-stat-balance">
          <span class="home-stat-icon" aria-hidden="true">◎</span>
          <span class="pet-doodle pet-dog" aria-hidden="true">
            <svg viewBox="0 0 72 72" focusable="false">
              <path class="pet-fill" d="M20 23c6-7 25-7 32 0 9-4 15 1 13 11-1 7-7 12-12 13-2 12-9 18-18 18-10 0-17-7-18-18-7-2-11-7-10-14-1-8 5-14 13-10Z"/>
              <path d="M20 23c6-7 25-7 32 0 9-4 15 1 13 11-1 7-7 12-12 13-2 12-9 18-18 18-10 0-17-7-18-18-7-2-11-7-10-14-1-8 5-14 13-10Z"/>
              <path d="M27 39h1m16 0h1M32 47c3 3 6 3 9 0m-6-3h3m-1 1v5"/>
            </svg>
          </span>
          <span class="metric-label">今日余额</span>
          <strong class="home-stat-value"><span id="calorieBalance">—</span><small>kcal</small></strong>
          <span class="metric-note" id="balanceNote">完成资料后自动计算</span>
        </article>
      </div>

      <div class="home-actions">
        <a class="button" href="ai-food.html">📷 拍照记一餐</a>
        <a class="button secondary" href="progress.html">记录体重</a>
        <button class="home-profile-entry" id="homeSetupProfile" type="button">完善个人资料</button>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="footer-wrap"><span>刚刚好计划 · 未登录本地保存，登录后跨设备同步</span><div class="footer-links"><a href="diet.html">饮食</a><a href="workout.html">训练</a><a href="progress.html">进度</a><a href="takeout.html">外卖</a></div></div></footer>
</body>
</html>
